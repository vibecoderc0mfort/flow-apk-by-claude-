name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Download big run.sh from release "files" (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download files -p run.sh -R "${{ github.repository }}" || echo "no release file, skipping"

      - name: Unpack project and apply run.sh
        run: |
          unzip -q RootLauncher.zip
          if [ -f run.sh ]; then
            cp run.sh RootLauncher/app/src/main/assets/run.sh
          fi
          ls -lh RootLauncher/app/src/main/assets/

      - name: Build
        working-directory: RootLauncher
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: RootLauncher/app/build/outputs/apk/debug/app-debug.apk
