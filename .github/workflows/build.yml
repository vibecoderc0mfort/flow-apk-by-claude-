name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Download script from release "files" (any file name)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          gh release download files -R "${{ github.repository }}" -p '*' -D dl || echo "no release found, skipping"
          f=$(find dl -type f -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          if [ -n "$f" ]; then
            cp "$f" run.sh
            echo "using: $f"
          fi

      - name: Unpack project and apply run.sh
        run: |
          unzip -q RootLauncher.zip
          if [ -f run.sh ]; then
            cp run.sh RootLauncher/app/src/main/assets/run.sh
          fi
          ls -lh RootLauncher/app/src/main/assets/

      - name: Build
        working-directory: RootLauncher
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: RootLauncher/app/build/outputs/apk/debug/app-debug.apk
